# CalcStar —— 小学四则运算口算练习桌面应用
# 构建后端 setuptools，src 布局；web 前端资源由 PyInstaller spec 打包，
# 故 setuptools 不包含 package-data。

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "calcstar"
version = "0.1.0"
description = "小学四则运算口算练习桌面应用（PyQt5 + PyQtWebEngine）"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "PyQt5>=5.15",
    "PyQtWebEngine>=5.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pyinstaller>=6",
]

[project.scripts]
calcstar = "calcstar.desktop.window:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=calcstar --cov-report=term-missing --cov-fail-under=85"
